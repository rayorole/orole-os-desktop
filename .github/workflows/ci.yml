name: ci

# Pull requests and pushes to main, read-only token, no secrets. Nothing here publishes or signs anything.
# The push run on main exists to prime the Go, bun and NSIS caches: GitHub only lets a pull request
# restore caches that were saved on the base branch, so with `pull_request` alone no PR ever got a hit.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its older run; runs on main always finish so they can save the caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Go verification. `go test -race` dominates the wall time here, so nothing else waits behind it.
  go:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vet
        run: go vet ./...
      - name: Go test (race)
        run: go test -race ./...
      - name: Bindings are up to date
        shell: pwsh
        run: |
          go tool mygo generate
          git diff --exit-code -- frontend/src/mygo.ts

  # Frontend verification. No Go needed: it runs next to the go job instead of behind it.
  web:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # bun's package cache, keyed on the lockfile; `bun install` still links node_modules from it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Frontend install
        run: bun install --cwd frontend --frozen-lockfile
      - name: Frontend check (tsc, lint, vitest)
        run: bun run --cwd frontend check
      - name: Frontend build
        run: bun run --cwd frontend build
      # Fails when the entry chunk grows past scripts/bundle-budget.json; see docs/development/testing.md.
      - name: Entry chunk is within its size budget
        run: bun scripts/check-bundle-size.mjs

  # Daemon, CLI and the packaged app with its NSIS installer. Independent of the test jobs, so the
  # slowest step (mygo build) overlaps them instead of following them.
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.bun\install\cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # mygo downloads NSIS into %LOCALAPPDATA%\mygo\nsis-<version> on first use and reuses it after.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\mygo
          key: nsis-${{ runner.os }}-${{ hashFiles('go.mod') }}
          restore-keys: nsis-${{ runner.os }}-
      - name: Frontend install
        run: bun install --cwd frontend --frozen-lockfile
      - name: Build daemon, CLI and packaged app (mygo build)
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Installer exists
        shell: pwsh
        run: |
          $i = Get-ChildItem "build/windows-amd64/*Setup*.exe"
          if (-not $i) { throw "no installer produced" }
          $i | Format-Table Name, Length

  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux terminal persistence dependency
        run: sudo apt-get update && sudo apt-get install -y tmux
      # Native Linux PTY/tmux joins the portable lane; this is not a Linux desktop release.
      - name: Go test (race), portable packages and Linux terminals
        run: go test -race ./internal/ipc/... ./internal/database/... ./internal/platform/... ./internal/paths/... ./internal/credentials/... ./internal/terminals/... ./internal/sandbox/... ./cmd/orole-guest/...

      # The guest agent ships inside the Linux VM image: it must build static for linux/amd64.
      - name: Build orole-guest (linux/amd64, static)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/orole-guest" ./cmd/orole-guest

      - name: orole-cli must not link daemon/sqlite/ssh/MCP
        run: ./scripts/check-cli-linkage.sh

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned release, verified against its published sha256, run on the workflow files only.
      - name: actionlint 1.7.12
        run: |
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml
